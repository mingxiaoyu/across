name: Cloudflared IPK

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install autoconf automake autopoint binutils bison build-essential bzip2 \
          ccache cmake cpio curl device-tree-compiler flex gawk gettext \
          gcc-multilib g++-multilib git libgnutls28-dev gperf intltool \
          libc6-dev-i386 libelf-dev libglib2.0-dev libgmp-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
          libssl-dev libtool zlib1g-dev ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pyelftools rsync squashfs-tools swig unzip vim wget zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /upload
        sudo chown $USER:$GROUPS /upload

    - name: Compile the firmware
      id: compile
      run: |
        # Remember the repository root before we cd into the SDK directory
        REPO_ROOT="$PWD"

        # Download the OpenWrt SDK
        wget https://downloads.immortalwrt.org/releases/24.10.3/targets/x86/64/immortalwrt-sdk-24.10.3-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

        # Extract the SDK
        tar --zstd -xvf immortalwrt-sdk-24.10.3-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

        # List the extracted files to check directory name(s)
        ls -l

        # Use find to identify the exact directory
        SDK_DIR=$(find . -type d -name 'immortalwrt-sdk*' | head -n 1)

        # Change directory to the identified SDK directory
        cd "$SDK_DIR"

        # First run to generate a default .config file
        make defconfig

        # Update and install feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # Remove cloudflared package installed from feeds
        rm -rf package/feeds/packages/cloudflared
        rm -rf package/cloudflared
        
        # cloudflared isn't part of this SDK's frozen feeds, so use the package
        # definition already vendored in this repository at ./cloudflared
        cp -r "$REPO_ROOT/cloudflared" package/cloudflared

        # Configure package to be built
        echo "CONFIG_PACKAGE_cloudflared=y" >> .config

        # Compile the package
        make package/cloudflared/compile V=s BUILD_LOG=y -j$(nproc)

    - name: Organize files
      id: organize
      run: |
        # Ensure 'upload' is a directory
        if [ ! -d "upload" ]; then
          mkdir -p upload
        fi

        # 尝试搬运(bin 存在则优先用，不存在则全局搜）
        if [ -d "./bin" ]; then
          find ./bin -type f -name "*cloudflared*" -exec mv -n "{}" upload/ \;
        else
          echo "⚠️ ./bin 不存在，改用全局搜索 .ipk..."
          find . -type f -name "*cloudflared*.ipk" -exec mv -n "{}" upload/ \; 2>/dev/null || true
        fi

        # 确认结果
        echo "📦 upload 目录内容："
        ls -lh upload/ || echo "⚠️ upload 为空，未找到 cloudflared 产物"

        # 时间戳
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      with:
        name: Cloudflared-IPK-${{ env.FILE_DATE }}
        path: upload
