name: OpenWrt IPK

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install autoconf automake autopoint binutils bison build-essential bzip2 \
          ccache cmake cpio curl device-tree-compiler flex gawk gettext \
          gcc-multilib g++-multilib git libgnutls28-dev gperf intltool \
          libc6-dev-i386 libelf-dev libglib2.0-dev libgmp-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
          libssl-dev libtool zlib1g-dev ninja-build p7zip p7zip-full patch \
          pkgconf python3 python3-pyelftools rsync squashfs-tools swig unzip vim wget zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /upload
        sudo chown $USER:$GROUPS /upload

    - name: Compile the firmware
      id: compile
      run: |
        # Download the OpenWrt SDK
        wget https://downloads.immortalwrt.org/releases/24.10.3/targets/x86/64/immortalwrt-sdk-24.10.3-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

        # Extract the SDK
        tar --zstd -xvf immortalwrt-sdk-24.10.3-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

        # List the extracted files to check directory name(s)
        ls -l

        # Use find to identify the exact directory
        SDK_DIR=$(find . -type d -name 'immortalwrt-sdk*' | head -n 1)

        # Change directory to the identified SDK directory
        cd "$SDK_DIR"

        # First run to generate a default .config file
        make defconfig

        # Update and install feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # Clone the openwrt-fchomo package
        git clone --depth 1 --branch master --single-branch --no-checkout https://github.com/fcshark-org/openwrt-fchomo.git package/openwrt-fchomo
        pushd package/openwrt-fchomo
        umask 022
        git checkout master  # Make sure you're on the right branch or commit
        popd

        # Configure package to be built
        echo "CONFIG_PACKAGE_luci-app-fchomo=y" >> .config

        # Compile the package
        make package/luci-app-fchomo/compile V=s BUILD_LOG=y -j$(nproc)

    - name: Organize files
      id: organize
      run: |
        # Ensure 'upload' is a directory
        if [ ! -d "upload" ]; then
          mkdir -p upload
        fi
        
        # Move the IPK files to the upload folder
        find . -type f -name "*.ipk" -exec cp {} upload/ \;

        # Set the current timestamp for file naming
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      with:
        name: IPK-${{ env.FILE_DATE }}
        path: upload
